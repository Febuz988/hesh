# coturn per HESH. Credenziali temporanee generate dall'API (GET /calls/turn).
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49400
realm=hesh.it
use-auth-secret
fingerprint
no-multicast-peers
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
# Il relay non deve raggiungere la rete interna del VPS.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# TLS (turns:5349) con il certificato di api.hesh.it; coturn legge i file come utente non root,
# quindi: chmod o+r sui file live/ e archive/ oppure copia periodica. Se mancano, parte solo turn:3478.
cert=/etc/letsencrypt/live/api.hesh.it/fullchain.pem
pkey=/etc/letsencrypt/live/api.hesh.it/privkey.pem
# Log su stdout (docker logs, ruotati dal compose). Contengono gli IP dei partecipanti:
# per spegnerli del tutto sostituire con `no-stdout-log` e `log-file=/var/tmp/turn.log`.
log-file=stdout
simple-log
