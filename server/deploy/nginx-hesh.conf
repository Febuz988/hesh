# /etc/nginx/sites-available/hesh  -> symlink in sites-enabled
# Sostituire SERVER_NAME con il sottodominio scelto (es. hesh.sovrano.cloud)
limit_req_zone $binary_remote_addr zone=hesh_reg:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=hesh_api:10m rate=30r/s;

server {
    listen 80;
    server_name SERVER_NAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SERVER_NAME;

    # certbot --nginx -d SERVER_NAME
    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;

    client_max_body_size 60m;
    access_log off;                      # niente log di chi parla con chi
    error_log /var/log/nginx/hesh.error.log warn;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = /register {
        limit_req zone=hesh_reg burst=3 nodelay;
        proxy_pass http://127.0.0.1:8087;
        include /etc/nginx/proxy_params;
    }

    location /messages/stream {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location / {
        limit_req zone=hesh_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8087;
        include /etc/nginx/proxy_params;
    }
}
