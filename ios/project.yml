# XcodeGen: `brew install xcodegen && cd ios && xcodegen generate && open HESH.xcodeproj`
name: HESH
options:
  bundleIdPrefix: it.hesh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 8Y6LKSFEJF
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LibSignalClient:
    url: https://github.com/signalapp/libsignal
    from: "0.80.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  HESHShared:
    type: framework
    platform: iOS
    sources: [HESHShared/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.hesh.app.shared
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: LibSignalClient
      - package: GRDB

  HESH:
    type: application
    platform: iOS
    sources: [HESH]
    info:
      path: HESH/Info.plist
      properties:
        CFBundleDisplayName: HESH
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: true
        NSCameraUsageDescription: "Serve solo per leggere il QR di invito e per scattare foto da inviare."
        NSMicrophoneUsageDescription: "Per registrare messaggi vocali e chiamate. Un indicatore rosso mostra quando stai registrando."
        NSLocationWhenInUseUsageDescription: "Per mostrare la tua posizione sulla mappa famiglia e allegarla ai messaggi che scegli di inviare."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Serve per gli avvisi di arrivo e partenza dai luoghi che imposti e per la condivisione a tempo che attivi tu. Puoi interromperla quando vuoi."
        NSFaceIDUsageDescription: "Per sbloccare HESH e le chat segrete su questo iPhone. Il volto non lascia mai il dispositivo."
        NSPhotoLibraryUsageDescription: "Per scegliere foto e video da inviare."
        UIBackgroundModes: [remote-notification, location, fetch]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [hesh]
            CFBundleURLName: it.hesh.app
    entitlements:
      path: HESH/HESH.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.it.hesh]
        com.apple.developer.associated-domains: [applinks:hesh.it]
    dependencies:
      - target: HESHShared
      - target: HESHNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.hesh.app

  HESHNotificationService:
    type: app-extension
    platform: iOS
    sources: [HESHNotificationService]
    info:
      path: HESHNotificationService/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: HESHNotificationService/HESHNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.it.hesh]
    dependencies:
      - target: HESHShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.hesh.app.nse
