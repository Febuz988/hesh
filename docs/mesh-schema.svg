<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C10"/><stop offset="1" stop-color="#15171E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8FF4D"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C8AA5"/>
    </marker>
    <marker id="arrowIce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4FF2FF"/>
    </marker>
  </defs>
  <rect width="1400" height="960" fill="url(#bg)"/>

  <text x="60" y="64" fill="#FFFFFF" font-size="30" font-weight="700" letter-spacing="2">HESH MESH</text>
  <text x="60" y="94" fill="#9AA3B5" font-size="16">Consegna senza rete: Bluetooth / Wi-Fi tra iPhone vicini, poi internet appena uno la trova</text>

  <!-- Zona senza rete -->
  <rect x="60" y="130" width="760" height="330" rx="26" fill="#C8FF4D" fill-opacity="0.04" stroke="#C8FF4D" stroke-opacity="0.35" stroke-dasharray="8 8"/>
  <text x="84" y="164" fill="#C8FF4D" font-size="13" font-weight="700" letter-spacing="2">ZONA SENZA RETE (stadio, montagna, blackout)</text>

  <!-- Phones -->
  <g id="p1">
    <rect x="110" y="220" width="130" height="200" rx="22" fill="#1C1F28" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="124" y="236" width="102" height="150" rx="12" fill="#0B0C10"/>
    <circle cx="175" cy="290" r="22" fill="#FF4F6D"/>
    <text x="175" y="296" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">SOS</text>
    <text x="175" y="345" fill="#9AA3B5" font-size="11" text-anchor="middle">nessuna rete</text>
    <text x="175" y="448" fill="#FFF" font-size="15" font-weight="600" text-anchor="middle">Mamma</text>
  </g>
  <g id="p2">
    <rect x="370" y="220" width="130" height="200" rx="22" fill="#1C1F28" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="384" y="236" width="102" height="150" rx="12" fill="#0B0C10"/>
    <rect x="404" y="285" width="62" height="34" rx="8" fill="#9D5CFF" fill-opacity="0.25" stroke="#9D5CFF"/>
    <text x="435" y="307" fill="#9D5CFF" font-size="11" font-weight="700" text-anchor="middle">cifrato</text>
    <text x="435" y="345" fill="#9AA3B5" font-size="11" text-anchor="middle">nessuna rete</text>
    <text x="435" y="448" fill="#FFF" font-size="15" font-weight="600" text-anchor="middle">Figlio</text>
    <text x="435" y="468" fill="#7C8AA5" font-size="11" text-anchor="middle">solo inoltra, non legge</text>
  </g>
  <g id="p3">
    <rect x="630" y="220" width="130" height="200" rx="22" fill="#1C1F28" stroke="#C8FF4D" stroke-opacity="0.6"/>
    <rect x="644" y="236" width="102" height="150" rx="12" fill="#0B0C10"/>
    <rect x="664" y="285" width="62" height="34" rx="8" fill="#9D5CFF" fill-opacity="0.25" stroke="#9D5CFF"/>
    <text x="695" y="307" fill="#9D5CFF" font-size="11" font-weight="700" text-anchor="middle">cifrato</text>
    <text x="695" y="345" fill="#C8FF4D" font-size="11" text-anchor="middle">ha internet</text>
    <text x="695" y="448" fill="#FFF" font-size="15" font-weight="600" text-anchor="middle">Papà</text>
    <text x="695" y="468" fill="#7C8AA5" font-size="11" text-anchor="middle">ponte verso il server</text>
  </g>

  <!-- hops -->
  <line x1="250" y1="320" x2="360" y2="320" stroke="#C8FF4D" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="305" y="305" fill="#C8FF4D" font-size="12" text-anchor="middle">Bluetooth / Wi-Fi</text>
  <text x="305" y="390" fill="#7C8AA5" font-size="11" text-anchor="middle">10-50 m</text>
  <line x1="510" y1="320" x2="620" y2="320" stroke="#C8FF4D" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="565" y="305" fill="#C8FF4D" font-size="12" text-anchor="middle">Bluetooth / Wi-Fi</text>
  <text x="565" y="390" fill="#7C8AA5" font-size="11" text-anchor="middle">10-50 m</text>

  <!-- numbers -->
  <circle cx="110" cy="220" r="16" fill="#C8FF4D"/><text x="110" y="225" fill="#0B0C10" font-size="14" font-weight="800" text-anchor="middle">1</text>
  <circle cx="370" cy="220" r="16" fill="#C8FF4D"/><text x="370" y="225" fill="#0B0C10" font-size="14" font-weight="800" text-anchor="middle">2</text>
  <circle cx="630" cy="220" r="16" fill="#C8FF4D"/><text x="630" y="225" fill="#0B0C10" font-size="14" font-weight="800" text-anchor="middle">3</text>

  <!-- Server -->
  <rect x="920" y="250" width="180" height="140" rx="22" fill="#1C1F28" stroke="#4FF2FF" stroke-opacity="0.6"/>
  <text x="1010" y="300" fill="#4FF2FF" font-size="14" font-weight="700" text-anchor="middle">api.hesh.it</text>
  <text x="1010" y="325" fill="#9AA3B5" font-size="12" text-anchor="middle">Sovrano</text>
  <text x="1010" y="360" fill="#7C8AA5" font-size="11" text-anchor="middle">relay cieco, stessa busta</text>
  <circle cx="920" cy="250" r="16" fill="#4FF2FF"/><text x="920" y="255" fill="#0B0C10" font-size="14" font-weight="800" text-anchor="middle">4</text>
  <line x1="770" y1="320" x2="910" y2="320" stroke="#4FF2FF" stroke-width="3" marker-end="url(#arrowIce)"/>
  <text x="840" y="305" fill="#4FF2FF" font-size="12" text-anchor="middle">internet</text>

  <!-- Nonna -->
  <g id="p4">
    <rect x="1200" y="220" width="130" height="200" rx="22" fill="#1C1F28" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="1214" y="236" width="102" height="150" rx="12" fill="#0B0C10"/>
    <circle cx="1265" cy="290" r="22" fill="#FF4F6D"/>
    <text x="1265" y="296" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">SOS</text>
    <text x="1265" y="345" fill="#9AA3B5" font-size="11" text-anchor="middle">a casa, online</text>
    <text x="1265" y="448" fill="#FFF" font-size="15" font-weight="600" text-anchor="middle">Nonna</text>
  </g>
  <circle cx="1200" cy="220" r="16" fill="#4FF2FF"/><text x="1200" y="225" fill="#0B0C10" font-size="14" font-weight="800" text-anchor="middle">5</text>
  <line x1="1100" y1="320" x2="1190" y2="320" stroke="#4FF2FF" stroke-width="3" marker-end="url(#arrowIce)"/>
  <text x="1145" y="305" fill="#4FF2FF" font-size="12" text-anchor="middle">push + WS</text>

  <!-- ack back -->
  <path d="M1265,425 C1265,520 175,520 175,425" fill="none" stroke="#7C8AA5" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowDim)"/>
  <text x="720" y="508" fill="#7C8AA5" font-size="12" text-anchor="middle">conferma di consegna: torna indietro per la stessa strada (o via internet quando Mamma la ritrova)</text>

  <!-- Steps -->
  <g font-size="13" fill="#D7DCE6">
    <text x="60" y="580" fill="#FFF" font-size="16" font-weight="700">Passi</text>
    <text x="60" y="610"><tspan fill="#C8FF4D" font-weight="700">1</tspan>  Mamma preme SOS. Il contenuto viene cifrato con Signal per ogni membro (come oggi). Il server non risponde: la busta va in coda e viene offerta via Multipeer.</text>
    <text x="60" y="636"><tspan fill="#C8FF4D" font-weight="700">2</tspan>  Il Figlio è a portata: riceve la busta, la salva, non può aprirla (non è per lui o lo è ma resta cifrata per gli altri). La rioffre a chiunque incontri.</text>
    <text x="60" y="662"><tspan fill="#C8FF4D" font-weight="700">3</tspan>  Papà la riceve e ha internet: la consegna al server con la normale POST /messages. Per il server è identica a un invio diretto.</text>
    <text x="60" y="688"><tspan fill="#4FF2FF" font-weight="700">4</tspan>  Il server la inoltra a tutti i destinatari online, con push APNs time-sensitive per l'SOS.</text>
    <text x="60" y="714"><tspan fill="#4FF2FF" font-weight="700">5</tspan>  Nonna la legge. La sua app sa che è arrivata via mesh e lo mostra ("inoltrato da Papà").</text>
  </g>

  <!-- Regole -->
  <rect x="60" y="750" width="620" height="170" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="84" y="782" fill="#FFF" font-size="15" font-weight="700">Regole della mesh</text>
  <g font-size="12.5" fill="#B9C1D0">
    <text x="84" y="808">Solo membri HESH: la scoperta Multipeer usa un token derivato dalla chiave di gruppo, estranei non vedono nulla.</text>
    <text x="84" y="832">Ogni busta ha un ULID: chi l'ha già vista la scarta (niente loop). TTL 6 salti, scadenza 24 ore.</text>
    <text x="84" y="856">Priorità: SOS e posizione passano per primi, testo dopo, allegati mai (troppo grandi).</text>
    <text x="84" y="880">Chi inoltra vede solo mittente, destinatario e dimensione: lo stesso che vede il server.</text>
    <text x="84" y="904">Radio accesa solo se il server non risponde o se attivi "Modalità vicini": niente consumo in condizioni normali.</text>
  </g>

  <!-- Stack -->
  <rect x="720" y="750" width="620" height="170" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="744" y="782" fill="#FFF" font-size="15" font-weight="700">Cosa viaggia</text>
  <rect x="744" y="800" width="572" height="30" rx="8" fill="#9D5CFF" fill-opacity="0.2" stroke="#9D5CFF"/>
  <text x="1030" y="820" fill="#D7DCE6" font-size="12.5" text-anchor="middle">Signal: contenuto cifrato end-to-end (Double Ratchet / Sender Key)</text>
  <rect x="744" y="838" width="572" height="30" rx="8" fill="#C8FF4D" fill-opacity="0.12" stroke="#C8FF4D"/>
  <text x="1030" y="858" fill="#D7DCE6" font-size="12.5" text-anchor="middle">Busta HESH: id, da, a, tipo, priorità, TTL, salti</text>
  <rect x="744" y="876" width="572" height="30" rx="8" fill="#4FF2FF" fill-opacity="0.12" stroke="#4FF2FF"/>
  <text x="1030" y="896" fill="#D7DCE6" font-size="12.5" text-anchor="middle">Trasporto: MultipeerConnectivity (BLE + Wi-Fi peer-to-peer) oppure HTTPS verso il server</text>
</svg>
